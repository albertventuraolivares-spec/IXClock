[build]
  publish = "."
  functions = "netlify/functions"

# Cabeceras de seguridad para toda la web (idea 66 del backlog).
# - nosniff: el navegador no «adivina» el tipo de un archivo; un .txt no se
#   ejecuta como script aunque lo parezca.
# - SAMEORIGIN / frame-ancestors 'self': ninguna OTRA web puede meter IXClocK
#   en un iframe para engañar a alguien con clics (clickjacking). La propia
#   app sí puede, y el navegador interno sigue enmarcando webs de fuera: esto
#   solo decide quién puede enmarcarnos a NOSOTROS.
# - Permissions-Policy: se cierran solo cosas que la app no usa. Ubicación,
#   micrófono, pantalla completa y lo demás siguen como estaban.
# - Sin HSTS: todo el dominio .app ya está en la lista precargada de los
#   navegadores, así que solo va por HTTPS de todas formas.
# Qué scripts se pueden cargar (idea 77), de momento SOLO EN MODO INFORME
# (Report-Only): no bloquea nada, solo avisa en la consola del navegador de lo
# que bloquearía. Lista: los CDN de hls.js, Leaflet y EmulatorJS (con sus
# espejos) y el botón de Google. 'unsafe-inline' y 'unsafe-eval' hacen falta
# porque la app tiene scripts y onclick en línea, y la calculadora gráfica usa
# `new Function`; blob: y wasm son del emulador. Aun así corta lo importante:
# que algo inyectado cargue un script de un dominio cualquiera. Cuando se haya
# visto que no avisa de nada en uso real, se cambia el nombre de la cabecera a
# Content-Security-Policy y pasa a ser obligatoria (prueba: pruebas/csp.js).
# Las páginas del proxy llevan su propia CSP aislada aparte.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'; object-src 'none'"
    Content-Security-Policy-Report-Only = "script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net https://unpkg.com https://cdn.emulatorjs.org https://accounts.google.com; base-uri 'self'"
    Permissions-Policy = "usb=(), serial=(), bluetooth=(), hid=(), payment=(), browsing-topics=()"

# Caché de los estáticos (idea 73). Sin esto Netlify manda «max-age=0» y el
# navegador pregunta por cada icono en cada visita. Los nombres NO llevan
# huella (icon-192.png siempre se llama igual), así que nada de «immutable»
# ni de un año: si se cambia un icono, en como mucho una semana llega a todos,
# y stale-while-revalidate hace que se renueve por detrás sin esperar.
# index.html, sw.js y tailwind.css NO van aquí a propósito: si se quedaran en
# caché, una actualización de la app tardaría días en verse.
# Con nombre exacto: no está claro que Netlify acepte «/*.png» en `for`.
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/favicon-16.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/favicon-32.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/icon-192.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/icon-512.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/icon-512-maskable.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/screenshot-wide.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/screenshot-narrow.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Archivos internos que NO son parte de la web (idea 70 del backlog).
# Como `publish = "."` sube la carpeta entera, sin esto cualquiera podía abrir
# /BACKLOG.md, /pruebas/..., el código de las funciones o package.json.
# `force = true` hace falta porque los archivos existen: sin él, Netlify los
# serviría igual y la regla no haría nada. Responden 404, como si no
# existieran. Si se añade otra carpeta o archivo interno, AÑADIRLO aquí; la
# prueba pruebas/ocultos.js avisa de cualquier archivo nuevo sin decidir.
[[redirects]]
  from = "/pruebas/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/.github/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/BACKLOG.md"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

[build]
  publish = "."
  functions = "netlify/functions"

# Cabeceras de seguridad para toda la web (idea 66 del backlog).
# - nosniff: el navegador no «adivina» el tipo de un archivo; un .txt no se
#   ejecuta como script aunque lo parezca.
# - SAMEORIGIN / frame-ancestors 'self': ninguna OTRA web puede meter IXClocK
#   en un iframe para engañar a alguien con clics (clickjacking). La propia
#   app sí puede, y el navegador interno sigue enmarcando webs de fuera: esto
#   solo decide quién puede enmarcarnos a NOSOTROS.
# - Permissions-Policy: se cierran solo cosas que la app no usa. Ubicación,
#   micrófono, pantalla completa y lo demás siguen como estaban.
# - Sin HSTS: todo el dominio .app ya está en la lista precargada de los
#   navegadores, así que solo va por HTTPS de todas formas.
# La CSP completa (qué scripts se pueden cargar) NO va aquí todavía: la app
# carga cosas de muchos sitios y una lista mal hecha la rompería. Las páginas
# del proxy llevan su propia CSP aislada, que es donde el riesgo era real.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'; object-src 'none'"
    Permissions-Policy = "usb=(), serial=(), bluetooth=(), hid=(), payment=(), browsing-topics=()"

# Archivos internos que NO son parte de la web (idea 70 del backlog).
# Como `publish = "."` sube la carpeta entera, sin esto cualquiera podía abrir
# /BACKLOG.md, /pruebas/..., el código de las funciones o package.json.
# `force = true` hace falta porque los archivos existen: sin él, Netlify los
# serviría igual y la regla no haría nada. Responden 404, como si no
# existieran. Si se añade otra carpeta o archivo interno, AÑADIRLO aquí; la
# prueba pruebas/ocultos.js avisa de cualquier archivo nuevo sin decidir.
[[redirects]]
  from = "/pruebas/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/.github/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/BACKLOG.md"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

# Pasa TODAS las pruebas de pruebas/ en cada PR (idea 74).
# Las pruebas buscan Playwright, Chromium y el repo en rutas de la máquina de
# desarrollo; aquí se les dicen las de GitHub con IX_PW, IX_CHROME e IXROOT.
# No despliega nada: el despliegue lo hace Netlify al fusionar en main.
name: Pruebas
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright y Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          echo "IX_PW=$PWD/node_modules/playwright/index.js" >> "$GITHUB_ENV"
          echo "IX_CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Pruebas
        env:
          IXROOT: ${{ github.workspace }}
        run: sh pruebas/todas.sh
